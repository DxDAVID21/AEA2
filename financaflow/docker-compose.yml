services:
  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://financaflow:financaflow@db:5432/financaflow
      OLLAMA_URL: http://ollama:11434
      NODE_ENV: production
    volumes:
      - ./node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: financaflow
      POSTGRES_USER: financaflow
      POSTGRES_PASSWORD: financaflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    entrypoint: /bin/sh
    command: -c "ollama pull llama3.2:1b || true && ollama serve"
volumes:
  pgdata:
  ollamadata:
